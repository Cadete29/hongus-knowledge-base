name: Autenticación y seguridad

on:
  push:
    paths:
      - 'proyecto/backend/**'
      - 'proyecto/frontend/**'
      - 'proyecto/shared/**'
      - '.github/workflows/auth-security.yml'
  pull_request:
    paths:
      - 'proyecto/backend/**'
      - 'proyecto/frontend/**'
      - 'proyecto/shared/**'
      - '.github/workflows/auth-security.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hongus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: proyecto/backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hongus_test
      APP_ORIGIN: http://localhost:5173
      MAIL_MODE: log
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          working-directory: proyecto/backend
          require-lockfile: true
          cache: true
      - run: pnpm migrate
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proyecto/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
